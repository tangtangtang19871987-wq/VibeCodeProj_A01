[pytest]
# The reproduction suite lives in tests_gril/. The pre-existing array_generator
# tests under tests/ are left byte-for-byte as they were.
#
# `pythonpath = .pkgroot` exposes this checkout under its real package name
# (.pkgroot/array_generator is a symlink to the repo root), which is what the
# pre-existing top-level __init__.py expects. Without it, pytest cannot import
# the root package and collection fails for every suite in the repo -- a
# pre-existing condition, not one introduced here.
pythonpath = src .pkgroot
testpaths = tests_gril
addopts = --import-mode=importlib -q
norecursedirs = .pkgroot .git data results *.egg-info
markers =
    slow: full-canvas 2048x2048 runs (~6.5 s per case)
filterwarnings =
    ignore::UserWarning
